<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>efeitos</title>
<style>
  :root { --ink: #14181a; --sand: #e6dcc0; --amber: #e8a33a; --red: #e0352b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: Bahnschrift, "Arial Narrow", "Segoe UI", sans-serif; color: var(--sand); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* placa com o nome de quem pediu o efeito */
  #labels { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 5; }
  .placa {
    padding: 7px 22px; font-size: 24px; font-weight: 700; white-space: nowrap;
    background: rgba(20,24,26,.92); border-top: 3px solid var(--amber);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 100%, 0 100%);
    text-shadow: 0 1px 2px rgba(0,0,0,.6); animation: placaIn .3s ease-out both;
  }
  .placa b { color: var(--amber); }
  .placa.sai { animation: placaOut .35s ease-in forwards; }
  @keyframes placaIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes placaOut { to { opacity: 0; } }

  /* helicoptero */
  .heli { position: fixed; left: 0; width: 380px; z-index: 3; animation: voa var(--dur, 7s) linear forwards; }
  .heli svg { display: block; width: 100%; animation: bob 1.1s ease-in-out infinite alternate; filter: drop-shadow(0 18px 14px rgba(0,0,0,.35)); }
  .heli .rotor { transform-box: fill-box; transform-origin: center; animation: giro .09s linear infinite; }
  .heli .rotorT { transform-box: fill-box; transform-origin: center; animation: giroT .12s linear infinite; }
  @keyframes voa { from { transform: translateX(-420px); } to { transform: translateX(calc(100vw + 40px)); } }
  @keyframes bob { from { transform: translateY(-9px) rotate(-1.2deg); } to { transform: translateY(9px) rotate(1.8deg); } }
  @keyframes giro { 0% { transform: scaleX(1); } 50% { transform: scaleX(.22); } 100% { transform: scaleX(1); } }
  @keyframes giroT { to { transform: rotate(360deg); } }

  /* alerta de combate */
  .alerta { position: fixed; inset: 0; z-index: 2; pointer-events: none; animation: sirene .8s ease-in-out 4 both; }
  @keyframes sirene { 0%, 100% { box-shadow: inset 0 0 0 0 rgba(224,53,43,0); } 50% { box-shadow: inset 0 0 180px 50px rgba(224,53,43,.8); } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<script>
  const cv = document.getElementById('cv'), g = cv.getContext('2d');
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
  addEventListener('resize', fit); fit();
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---- placa com nome ----
  function placa(prefixo, nome, ms) {
    const el = document.createElement('div'); el.className = 'placa';
    el.appendChild(document.createTextNode(prefixo + ' · '));
    const b = document.createElement('b'); b.textContent = nome; el.appendChild(b);
    document.getElementById('labels').appendChild(el);
    setTimeout(() => { el.classList.add('sai'); setTimeout(() => el.remove(), 380); }, ms);
  }

  // ---- particulas (explosao e fumaca) ----
  let P = [], flash = 0, rodando = false, ultimo = 0;
  function liga() { if (!rodando) { rodando = true; ultimo = performance.now(); requestAnimationFrame(quadro); } }

  function quadro(t) {
    const dt = Math.min(.05, (t - ultimo) / 1000); ultimo = t;
    g.clearRect(0, 0, cv.width, cv.height);
    g.globalCompositeOperation = 'source-over';
    if (flash > 0) { g.fillStyle = 'rgba(255,244,214,' + (flash * .6) + ')'; g.fillRect(0, 0, cv.width, cv.height); flash -= dt * 3.2; }

    // fumaca/ blobs primeiro (fundo), depois fogo (soma de luz)
    for (const p of P) {
      p.age += dt; const a = p.age / p.life;
      if (a >= 1) { p.morto = true; continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.k === 'spark') p.vy += 900 * dt;
      if (p.k === 'smoke' || p.k === 'blob') { p.r += p.gr * dt; }
      if (p.k === 'fire') { p.r += p.gr * dt; p.vx *= .96; p.vy *= .96; }
    }
    P = P.filter(p => !p.morto);

    for (const p of P) {
      if (p.k !== 'smoke' && p.k !== 'blob') continue;
      const a = p.age / p.life;
      if (a < 0) continue;
      const alfa = (p.k === 'blob' ? Math.min(1, a / .22) * (1 - Math.max(0, (a - .7) / .3)) * .6 : Math.min(1, a / .1) * (1 - a) * .6);
      const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      const c = p.k === 'blob' ? '214,218,210' : '46,44,42';
      gr.addColorStop(0, 'rgba(' + c + ',' + alfa + ')'); gr.addColorStop(1, 'rgba(' + c + ',0)');
      g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
    }
    g.globalCompositeOperation = 'lighter';
    for (const p of P) {
      const a = p.age / p.life;
      if (a < 0) continue;
      if (p.k === 'fire') {
        const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        gr.addColorStop(0, 'rgba(255,' + Math.round(220 - a * 120) + ',90,' + (1 - a) + ')');
        gr.addColorStop(.5, 'rgba(255,' + Math.round(110 - a * 70) + ',20,' + (.55 * (1 - a)) + ')');
        gr.addColorStop(1, 'rgba(120,20,0,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
      } else if (p.k === 'spark') {
        g.strokeStyle = 'rgba(255,' + Math.round(200 - a * 110) + ',70,' + (1 - a) + ')'; g.lineWidth = p.r;
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); g.stroke();
      } else if (p.k === 'ring') {
        g.strokeStyle = 'rgba(255,230,180,' + (.8 * (1 - a)) + ')'; g.lineWidth = 16 * (1 - a) + 1;
        g.beginPath(); g.arc(p.x, p.y, a * 560, 0, 7); g.stroke();
      }
    }
    if (P.length || flash > 0) requestAnimationFrame(quadro); else { rodando = false; g.clearRect(0, 0, cv.width, cv.height); }
  }
  const nova = o => P.push(Object.assign({ age: 0, vx: 0, vy: 0, gr: 0 }, o));

  function explosao(por) {
    const cx = cv.width * rnd(.28, .72), cy = cv.height * rnd(.5, .78);
    flash = 1; liga();
    nova({ k: 'ring', x: cx, y: cy, life: .7, r: 0 });
    for (let i = 0; i < 30; i++) { const an = rnd(0, 6.28), v = rnd(30, 260);
      nova({ k: 'fire', x: cx + rnd(-30, 30), y: cy + rnd(-20, 20), vx: Math.cos(an) * v, vy: Math.sin(an) * v - 60, r: rnd(40, 95), gr: rnd(60, 150), life: rnd(.55, 1.2) }); }
    for (let i = 0; i < 90; i++) { const an = rnd(-3.4, .2), v = rnd(220, 950);
      nova({ k: 'spark', x: cx, y: cy, vx: Math.cos(an) * v, vy: Math.sin(an) * v, r: rnd(2, 4.5), life: rnd(.6, 1.5) }); }
    for (let i = 0; i < 22; i++)
      nova({ k: 'smoke', x: cx + rnd(-90, 90), y: cy + rnd(-30, 30), vx: rnd(-25, 25), vy: rnd(-120, -35), r: rnd(50, 90), gr: rnd(40, 90), life: rnd(2.6, 4.2) });
    placa('Bombardeio', por, 4500);
  }
  function fumaca(por) {
    liga();
    for (let i = 0; i < 17; i++)
      nova({ k: 'blob', x: cv.width * rnd(.15, .85), y: cv.height * rnd(.42, .88), vx: rnd(-30, 30), vy: rnd(-14, 10), r: rnd(100, 150), gr: rnd(25, 50), life: rnd(5, 6.5), age: -rnd(0, .8) });
    placa('Cortina de fumaça', por, 5000);
  }

  // ---- helicoptero (SVG desenhado aqui, sem imagens externas) ----
  const HELI = `<svg viewBox="0 0 380 160" xmlns="http://www.w3.org/2000/svg">
    <ellipse class="rotor" cx="196" cy="34" rx="165" ry="5" fill="#1b1f1c" opacity=".78"/>
    <rect x="190" y="34" width="9" height="16" fill="#2b312b"/>
    <path d="M118 80 L26 66 L18 76 L116 98 Z" fill="#4b5a3a"/>
    <path d="M30 68 L12 36 L34 40 L44 70 Z" fill="#56683f"/>
    <g class="rotorT"><rect x="2" y="50" width="6" height="34" rx="3" fill="#1b1f1c" opacity=".8" transform="translate(12 -4)"/></g>
    <path d="M104 84 C104 58 156 48 218 52 C264 55 286 72 283 90 C279 111 244 121 186 121 C134 121 104 111 104 84 Z" fill="#5f7347"/>
    <path d="M236 57 C268 60 284 74 281 90 L234 90 Z" fill="#86b9e0" opacity=".85"/>
    <path d="M104 84 C104 98 134 110 186 112 L186 121 C134 121 104 111 104 84 Z" fill="#3f4d31" opacity=".6"/>
    <rect x="150" y="76" width="58" height="22" rx="3" fill="#3f4d31"/>
    <circle cx="268" cy="94" r="6" fill="#e8a33a"/>
    <path d="M150 121 L145 138 M238 121 L246 138" stroke="#1b1f1c" stroke-width="5" stroke-linecap="round"/>
    <path d="M118 140 L270 140 Q286 140 292 130" stroke="#1b1f1c" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>`;
  function helicoptero(por) {
    const dur = 7, d = document.createElement('div'); d.className = 'heli';
    d.style.top = Math.round(innerHeight * rnd(.1, .28)) + 'px'; d.style.setProperty('--dur', dur + 's');
    d.innerHTML = HELI;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), dur * 1000 + 200);
    placa('Apoio aéreo', por, 4500);
  }
  function alerta(por) {
    const d = document.createElement('div'); d.className = 'alerta'; document.body.appendChild(d);
    setTimeout(() => d.remove(), 3500);
    placa('Alerta de combate', por, 3300);
  }

  const FX = { helicoptero, explosao, fumaca, alerta };
  function conecta() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'fx' && FX[m.fx]) FX[m.fx](String(m.by || 'Alguém'));
    };
    ws.onclose = () => setTimeout(conecta, 2000);
  }
  conecta();
</script>
</body>
</html>
