<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ranking</title>
<style>
  :root {
    --ink: #14181a;
    --sand: #e6dcc0;
    --olive: #6f8a4e;
    --amber: #e8a33a;
    --steel: #86b9e0;
    --brass: #d9b45a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: Bahnschrift, "Arial Narrow", "Segoe UI", sans-serif; color: var(--sand); }

  #wrap { width: 360px; transform-origin: top left; }
  .panel {
    background: linear-gradient(180deg, rgba(20,24,26,.94), rgba(20,24,26,.82));
    border-top: 4px solid var(--olive);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
  }

  /* MVP: o elemento de destaque do painel */
  .mvp { padding: 12px 16px 12px; background: linear-gradient(90deg, rgba(232,163,58,.22), transparent); border-bottom: 1px solid rgba(230,220,192,.18); }
  .mvp .cap { font-size: 15px; font-weight: 600; color: var(--amber); }
  .mvp .row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .mvp .nome { flex: 1; font-size: 28px; font-weight: 700; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mvp .xp { font-size: 22px; font-weight: 700; color: var(--amber); font-variant-numeric: tabular-nums; }
  .mvp.vazio .nome { font-size: 20px; opacity: .55; font-weight: 600; }

  ol { list-style: none; margin: 0; padding: 6px 0 12px; }
  li { display: grid; grid-template-columns: 22px 34px 1fr auto; align-items: center; gap: 8px; padding: 6px 16px; font-size: 19px; }
  li .pos { font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }
  li .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .n small { display: block; font-size: 14px; font-weight: 500; opacity: .65; margin-top: -2px; }
  li .x { font-weight: 600; font-variant-numeric: tabular-nums; opacity: .9; }
  li:first-child .pos { color: var(--brass); opacity: 1; }
  .vazio-lista { padding: 10px 16px 14px; font-size: 17px; opacity: .55; }

  svg.ins { width: 30px; height: 26px; display: block; }

  /* cartao do !rank */
  #card {
    margin-top: 10px; padding: 12px 16px 14px; display: none;
    background: rgba(20,24,26,.95); border-left: 5px solid var(--steel);
    clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  }
  #card.on { display: block; animation: entra .3s cubic-bezier(.2,.9,.25,1) both; }
  #card.sai { animation: sai .3s ease-in forwards; }
  #card .l1 { display: flex; align-items: center; gap: 10px; }
  #card .nome { flex: 1; font-size: 24px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #card .pos { font-size: 20px; font-weight: 700; color: var(--steel); }
  #card .l2 { margin-top: 2px; font-size: 18px; opacity: .9; }
  .barra { height: 10px; margin-top: 8px; background: #0b0e0f; border: 1px solid rgba(230,220,192,.28); }
  .barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3f5230, var(--olive)); transition: width .7s cubic-bezier(.2,.8,.2,1); }
  #card .l3 { margin-top: 6px; font-size: 15px; opacity: .75; }

  @keyframes entra { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
  @keyframes sai { to { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { #card.on, #card.sai { animation-duration: .01s; } .barra i { transition: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div class="panel">
    <div class="mvp vazio" id="mvp">
      <div class="cap">MVP da live</div>
      <div class="row"><div class="nome" id="mvpNome">Ninguém ainda</div><div class="xp" id="mvpXp"></div></div>
    </div>
    <ol id="lista"></ol>
    <div class="vazio-lista" id="vazio">Fale no chat para entrar no ranking.</div>
  </div>
  <div id="card">
    <div class="l1"><span id="cIns"></span><span class="nome" id="cNome"></span><span class="pos" id="cPos"></span></div>
    <div class="l2" id="cRank"></div>
    <div class="barra"><i id="cBar"></i></div>
    <div class="l3" id="cNext"></div>
  </div>
</div>
<script>
  // Opcoes na URL: ?scale=1.2   ?card=7 (segundos do cartao !rank)
  const Q = new URLSearchParams(location.search);
  document.getElementById('wrap').style.transform = 'scale(' + (Number(Q.get('scale')) || 1) + ')';
  const CARD_MS = (Number(Q.get('card')) || 7) * 1000;
  const $ = id => document.getElementById(id);
  let RANKS = [];

  // insignia: patente vira divisas (verde), depois dourado, depois vermelho
  function insignia(rank) {
    const idx = Math.max(0, RANKS.indexOf(rank));
    const n = idx === 0 ? 0 : idx <= 3 ? idx : idx <= 6 ? idx - 3 : idx - 6;
    const cor = idx <= 3 ? '#8fcf74' : idx <= 6 ? '#e8a33a' : '#e8663d';
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 30 26'); svg.setAttribute('class', 'ins');
    if (n === 0) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 15); c.setAttribute('cy', 13); c.setAttribute('r', 4); c.setAttribute('fill', '#9aa58b');
      svg.appendChild(c); return svg;
    }
    for (let i = 0; i < Math.max(1, n); i++) {
      const p = document.createElementNS(NS, 'path');
      const y = 20 - i * 7;
      p.setAttribute('d', `M4 ${y} L15 ${y - 8} L26 ${y} L26 ${y + 3.5} L15 ${y - 4.5} L4 ${y + 3.5} Z`);
      p.setAttribute('fill', cor); svg.appendChild(p);
    }
    return svg;
  }
  const t = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const fmt = n => Number(n).toLocaleString('pt-BR');

  function render(r) {
    RANKS = r.ranks || RANKS;
    const mvp = $('mvp');
    if (r.mvp) { mvp.classList.remove('vazio'); $('mvpNome').textContent = r.mvp.name; $('mvpXp').textContent = '+' + fmt(r.mvp.xp) + ' XP'; }
    else { mvp.classList.add('vazio'); $('mvpNome').textContent = 'Ninguém ainda'; $('mvpXp').textContent = ''; }

    const ol = $('lista'); ol.replaceChildren();
    r.top.forEach((u, i) => {
      const li = t('li');
      li.appendChild(t('span', 'pos', i + 1));
      const ins = t('span'); ins.appendChild(insignia(u.rank)); li.appendChild(ins);
      const n = t('span', 'n', u.name); n.appendChild(t('small', null, u.rank)); li.appendChild(n);
      li.appendChild(t('span', 'x', fmt(u.xp) + ' XP'));
      ol.appendChild(li);
    });
    $('vazio').style.display = r.top.length ? 'none' : 'block';
  }

  let cardTimer = null;
  function mostraCard(c) {
    const el = $('card');
    $('cIns').replaceChildren(insignia(c.rank));
    $('cNome').textContent = c.name;
    $('cPos').textContent = '#' + c.pos;
    $('cRank').textContent = c.rank + ' · ' + fmt(c.xp) + ' XP';
    const pct = c.next ? Math.min(100, (c.xp / c.next.at) * 100) : 100;
    $('cNext').textContent = c.next ? 'Faltam ' + fmt(c.next.at - c.xp) + ' XP para ' + c.next.rank : 'Patente máxima';
    el.classList.remove('sai'); el.classList.add('on');
    $('cBar').style.width = '0%'; requestAnimationFrame(() => requestAnimationFrame(() => { $('cBar').style.width = pct + '%'; }));
    clearTimeout(cardTimer);
    cardTimer = setTimeout(() => { el.classList.add('sai'); setTimeout(() => el.classList.remove('on', 'sai'), 320); }, CARD_MS);
  }

  function conecta() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'init' && m.ranking) render(m.ranking);
      else if (m.type === 'ranking') render(m.ranking);
      else if (m.type === 'rankcard') mostraCard(m.card);
    };
    ws.onclose = () => setTimeout(conecta, 2000);
  }
  conecta();
</script>
</body>
</html>
