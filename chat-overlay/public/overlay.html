<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Chat Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --asphalt: rgba(13, 17, 13, .78);
    --olive: #3c4a2f;
    --brass: #e8b93a;
    --bone: #edeadc;
    --twitch: #9146ff;
    --youtube: #ff3b30;
    --kick: #53fc18;
    --scale: 1;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: 'Barlow Semi Condensed', system-ui, sans-serif;
    color: var(--bone);
    font-size: calc(26px * var(--scale));
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: calc(24px * var(--scale));
  }
  body.right { align-items: flex-end; }

  #pin { position: fixed; top: calc(24px * var(--scale)); left: calc(24px * var(--scale)); right: calc(24px * var(--scale)); z-index: 2; }
  body.right #pin { display: flex; justify-content: flex-end; }
  #view { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%); mask-image: linear-gradient(to bottom, transparent 0, #000 14%); }
  body.right #view { align-items: flex-end; }
  #list { flex: none; display: flex; flex-direction: column; gap: calc(10px * var(--scale)); max-width: 100%; }
  body.right #list { align-items: flex-end; }

  .msg {
    --accent: var(--twitch);
    position: relative;
    display: flex; gap: .55em; align-items: flex-start;
    width: fit-content; max-width: min(100%, calc(var(--maxw, 760px) * var(--scale)));
    padding: .45em .8em .5em .95em;
    background:
      linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%),
      var(--asphalt);
    backdrop-filter: blur(6px);
    clip-path: polygon(0 0, calc(100% - .7em) 0, 100% .7em, 100% 100%, .7em 100%, 0 calc(100% - .7em));
    animation: in .42s cubic-bezier(.2, .9, .25, 1) both;
    line-height: 1.22;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .msg::before { /* faixa da plataforma */
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: .24em;
    background: var(--accent);
  }
  .msg.youtube { --accent: var(--youtube); }
  .msg.kick { --accent: var(--kick); }
  .msg.out { animation: out .45s ease-in forwards; }

  .msg.hl { --accent: var(--brass); box-shadow: inset 0 0 0 1px rgba(232,185,58,.55); }
  .msg.hl::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 30%, rgba(232,185,58,.28) 50%, transparent 70%);
    transform: translateX(-120%); animation: sweep 1.1s .25s ease-out 1 forwards;
  }

  .avatar { width: 1.9em; height: 1.9em; border-radius: 50%; flex: none; margin-top: .05em; object-fit: cover; }
  .body { min-width: 0; }
  .head { display: flex; align-items: center; gap: .4em; margin-bottom: .08em; }
  .name { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: .86em; letter-spacing: .01em; }
  .badge {
    display: inline-grid; place-items: center; height: 1.05em; min-width: 1.05em; padding: 0 .25em;
    font: 700 .5em/1 'Chakra Petch', sans-serif; border-radius: .2em; color: #0d110d;
  }
  .badge.broadcaster { background: var(--brass); }
  .badge.mod { background: #6fcf6f; }
  .badge.vip { background: #ff7ac6; }
  .badge.sub { background: #b9a4ff; }
  .badge.verified { background: #cfd4cc; }
  .tag {
    font: 600 .62em/1 'Chakra Petch', sans-serif; padding: .22em .55em; border-radius: 999px;
    background: var(--brass); color: #0d110d;
  }
  .text { font-weight: 600; word-break: break-word; overflow-wrap: anywhere; }
  .text img { height: 1.45em; vertical-align: -.35em; margin: 0 .05em; }

  /* mensagem fixada */
  #pin .msg { max-width: min(100%, calc(900px * var(--scale))); font-size: 1.2em; padding: .7em 1.1em .75em 1.2em; }
  #pin .msg::before { width: .3em; }
  #pin .msg { --accent: var(--brass); box-shadow: inset 0 0 0 1px rgba(232,185,58,.6); }

  @keyframes in { from { opacity: 0; transform: translateX(-36px); clip-path: polygon(0 0, 0 0, 0 .7em, 0 100%, 0 100%, 0 calc(100% - .7em)); }
                  to   { opacity: 1; transform: none; } }
  body.right .msg { animation-name: inR; }
  @keyframes inR { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; transform: translateY(-8px); } }
  @keyframes sweep { to { transform: translateX(120%); } }


  body.cheio .msg { width: 100%; max-width: 100%; }
  body.cheio #list { width: 100%; }
  body.cheio #pin .msg { width: 100%; max-width: 100%; }

  /* ---- modo tela (?tela=1): chat como monitor na parede do cenário ---- */
  #bg, #bar, #bezel { display: none; }
  body.tela { padding: calc(40px * var(--scale)) calc(9px * var(--scale)) calc(9px * var(--scale)); }
  body.tela #bg { display: block; position: fixed; inset: 0; z-index: 0; border-radius: calc(10px * var(--scale));
    background: linear-gradient(180deg, rgba(24,18,11,.9), rgba(10,8,5,.94)); }
  body.tela #view, body.tela #pin { position: relative; z-index: 1; }
  body.tela #pin { position: fixed; top: calc(42px * var(--scale)); left: calc(12px * var(--scale)); right: calc(12px * var(--scale)); z-index: 2; }
  body.tela #bar { display: flex; align-items: center; gap: calc(7px * var(--scale)); position: fixed; z-index: 3; top: 0; left: 0; right: 0;
    height: calc(32px * var(--scale)); padding: 0 calc(14px * var(--scale));
    background: linear-gradient(180deg, rgba(255,190,90,.10), transparent); border-bottom: 1px solid rgba(255,190,90,.16); }
  body.tela #bar i { width: calc(9px * var(--scale)); height: calc(9px * var(--scale)); border-radius: 50%; background: #3a3328; transition: background .3s, box-shadow .3s; }
  body.tela #bar i.on[data-p=twitch]  { background: var(--twitch);  box-shadow: 0 0 8px var(--twitch); }
  body.tela #bar i.on[data-p=youtube] { background: var(--youtube); box-shadow: 0 0 8px var(--youtube); }
  body.tela #bar i.on[data-p=kick]    { background: var(--kick);    box-shadow: 0 0 8px var(--kick); }
  body.tela #bezel { display: block; position: fixed; inset: 0; z-index: 4; pointer-events: none; border-radius: calc(10px * var(--scale));
    border: calc(6px * var(--scale)) solid #15110b;
    box-shadow: 0 0 0 1px #4a3b26, 0 0 calc(30px * var(--scale)) rgba(255,170,60,.32), inset 0 0 calc(46px * var(--scale)) rgba(0,0,0,.65);
    background:
      repeating-linear-gradient(0deg, rgba(255,205,130,.04) 0 1px, transparent 1px 3px),
      linear-gradient(118deg, rgba(255,235,200,.07), transparent 32%); }

  @media (prefers-reduced-motion: reduce) { .msg, .msg::after { animation: none !important; } }
</style>
</head>
<body>
<div id="bg"></div>
<div id="bar"><i data-p="twitch"></i><i data-p="youtube"></i><i data-p="kick"></i></div>
<div id="bezel"></div>
<div id="pin"></div>
<div id="dbg" style="display:none;position:fixed;top:6px;right:6px;z-index:9;font:600 14px monospace;color:#e8b93a;background:#000a;padding:4px 8px;border-radius:4px"></div>
<div id="view"><div id="list"></div></div>

<script>
const q = new URLSearchParams(location.search);
const MAX = +(q.get('limite') || 0);     // 0 = guarda tudo desde que o servidor ligou
const FADE = +(q.get('some') || 0);    // segundos; 0 = nunca some
const TELA = q.get('tela') === '1';
const SCALE = +(q.get('scale') || (TELA ? 0.55 : 1));
if (TELA) document.body.classList.add('tela');
if (q.get('cheio') === '1' || (TELA && q.get('cheio') !== '0')) document.body.classList.add('cheio');
if (q.get('largura')) document.documentElement.style.setProperty('--maxw', q.get('largura') + 'px');
const setSt = s => document.querySelectorAll('#bar i').forEach(i => i.classList.toggle('on', !!(s && s[i.dataset.p])));
document.documentElement.style.setProperty('--scale', SCALE);
if (q.get('side') === 'right') document.body.classList.add('right');

const list = document.getElementById('list');
const pin = document.getElementById('pin');

function readable(hex) {
  if (!hex) return null;
  const n = parseInt(hex.slice(1), 16);
  let [r, g, b] = [n >> 16 & 255, n >> 8 & 255, n & 255];
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  if (lum < 0.5) { const k = (0.62 - lum); r += (255 - r) * k * 1.4; g += (255 - g) * k * 1.4; b += (255 - b) * k * 1.4; }
  return `rgb(${Math.min(255, r | 0)},${Math.min(255, g | 0)},${Math.min(255, b | 0)})`;
}

const BADGE = { broadcaster: 'ON', mod: 'M', vip: 'V', sub: '★', verified: '✓' };

function build(m) {
  const el = document.createElement('div');
  el.className = `msg ${m.platform}${m.highlight ? ' hl' : ''}`;
  el.dataset.id = m.id; el.dataset.user = m.user.toLowerCase(); el.dataset.platform = m.platform;
  if (m.highlight && m.highlight.kind === 'superchat' && m.highlight.color) el.style.setProperty('--accent', m.highlight.color);

  if (m.avatar) { const a = document.createElement('img'); a.className = 'avatar'; a.src = m.avatar; el.append(a); }

  const body = document.createElement('div'); body.className = 'body';
  const head = document.createElement('div'); head.className = 'head';
  for (const b of m.badges || []) {
    const s = document.createElement('span'); s.className = 'badge ' + b; s.textContent = BADGE[b] || ''; head.append(s);
  }
  const name = document.createElement('span'); name.className = 'name'; name.textContent = m.user;
  name.style.color = readable(m.color) || ({ youtube: '#ffb4ae', kick: '#b6ff9a' }[m.platform] || '#cdb8ff');
  head.append(name);
  if (m.highlight) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = m.highlight.label; head.append(t); }

  const text = document.createElement('div'); text.className = 'text';
  for (const p of m.parts) {
    if (p.t === 'text') text.append(document.createTextNode(p.v));
    else { const i = document.createElement('img'); i.src = p.url; i.alt = p.alt; text.append(i); }
  }
  body.append(head, text); el.append(body);
  return el;
}

let REM = 0, WHY = '-', INITS = 0;
function remove(el, why) {
  if (!el || el.classList.contains('out')) return;
  REM++; WHY = why || '?';
  el.classList.add('out'); setTimeout(() => el.remove(), 450);
}

function add(m) {
  if (list.querySelector(`[data-id="${CSS.escape(m.id)}"]`)) return;
  const el = build(m); list.append(el);
  if (MAX > 0) while (list.children.length > MAX) { list.firstElementChild.remove(); REM++; WHY = 'limite'; }
  else if (list.children.length > 3000) { list.firstElementChild.remove(); REM++; WHY = 'limite3000'; }
  if (FADE > 0) setTimeout(() => remove(el, 'some=' + FADE), FADE * 1000);
}

function setPin(m) { pin.replaceChildren(); if (m) pin.append(build(m)); }

const DBG = q.get('debug') === '1', VER = 8;
if (DBG) { const d = document.getElementById('dbg'); d.style.display = 'block';
  setInterval(() => d.textContent = `overlay v${VER} | limite=${MAX} some=${FADE} | msgs=${list.children.length} | init=${INITS} | removidas=${REM} (ultima: ${WHY})`, 500); }

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${protocol}//${location.host}/ws`);
  
  ws.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'init') { INITS++; setSt(d.status); list.replaceChildren(); (MAX > 0 ? d.history.slice(-MAX) : d.history).forEach(add); setPin(d.pinned); }
    else if (d.type === 'chat') add(d.msg);
    else if (d.type === 'status') setSt(d.status);
    else if (d.type === 'delete') { remove(list.querySelector(`[data-id="${CSS.escape(d.id)}"]`), 'apagada pelo mod/Twitch'); if (pin.firstChild && pin.firstChild.dataset.id === d.id) setPin(null); }
    else if (d.type === 'deleteUser') list.querySelectorAll(`[data-user="${CSS.escape(d.user.toLowerCase())}"][data-platform="${d.platform}"]`).forEach(el => remove(el, 'ban/timeout de ' + d.user));
    else if (d.type === 'pin') setPin(d.msg);
    else if (d.type === 'clear') list.querySelectorAll('.msg').forEach(el => remove(el, 'botao Limpar overlay'));
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
